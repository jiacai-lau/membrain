name: catalog lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catalog check (INDEX.yaml, ITEM.md, files)
        run: python3 scripts/catalog.py check . | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lint (warn-only)
        run: |
          python3 scripts/lint.py . --format md > lint-report.md || true
          cat lint-report.md >> "$GITHUB_STEP_SUMMARY"
