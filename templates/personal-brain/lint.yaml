# Lint settings for this brain (read by scripts/lint.py). Content: yours to edit; upgrades never overwrite it.
# Privacy checks do not run on a personal brain (it holds everything); duplicates, dates, deadlines, sitemap and log do.
log_types: [fix, ticket, client, lint, answer, note, project]
plugins: []                          # optional checks from scripts/lint_plugins/
# max_lines: 300                    # note files longer than this get W081 (propose a split)
# disable: [W002]                    # finding codes or names to turn off
